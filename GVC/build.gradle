archivesBaseName = 'GVCOverdrive'
ext.defaultModVersion = '1.0.0'
apply from: rootProject.file('gradle/overdrive-version.gradle')

processResources {
    def releaseVersion = project.version.toString()
    inputs.property 'gvcReleaseVersion', releaseVersion
    filesMatching('version.properties') {
        expand version: releaseVersion
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compile files(project(':HMG').sourceSets.main.output)
    compile files(project(':depend').sourceSets.main.output)
    compile 'javax.vecmath:vecmath:1.5.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
