ext.versionFile = project.file('version.properties')

def releaseVersion = project.defaultModVersion
if (versionFile.exists()) {
	def text = versionFile.getText('UTF-8')
	def modVersionProperty = text =~ /(?m)^[ \t]*mod_version[ \t]*=[ \t]*([^\s#]+)[ \t]*(?:#.*)?$/
	if (modVersionProperty.find()) {
		releaseVersion = modVersionProperty.group(1)
	} else if (text.trim() ==~ /\d+\.\d+\.\d+/) {
		releaseVersion = text.trim()
	} else {
		throw new GradleException("Missing mod_version in ${versionFile}. Expected: mod_version=x.y.z")
	}
}

if (!(releaseVersion ==~ /\d+\.\d+\.\d+/)) {
	throw new GradleException("Invalid mod_version '${releaseVersion}' in ${versionFile}. Expected semantic version: x.y.z")
}

ext.modVersion = releaseVersion
ext.fullVersion = releaseVersion
project.version = releaseVersion
