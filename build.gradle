buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.0.12'
    }
}




subprojects {
    apply plugin: 'forge'

    sourceCompatibility = 1.8
    targetCompatibility = 1.8

    archivesBaseName = project.projectDir.name

    minecraft{
        version = "1.7.10-10.13.4.1614-1.7.10"
        runDir = "eclipse"
    }


    tasks.withType(JavaExec) {
        jvmArgs "-Xms4G", "-Xmx4G"
    }


    afterEvaluate {
        processResources {
            def metadata = [modid: project.name, version: project.version, mcversion: '1.7.10']
            inputs.properties metadata
            inputs.property 'metadataFilter', 'literal-placeholder'
            filesMatching('mcmod.info') {
                filter { line ->
                    metadata.each { key, value -> line = line.replace('\$' + '{' + key + '}', value.toString()) }
                    line
                }
            }
        }
    }
}
